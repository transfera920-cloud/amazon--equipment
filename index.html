          <h1>登山裝備知識</h1>
          <p>CHAPTER 06｜亞馬遜國家山岳協會｜登山安全教育知識平台</p>
          <p>了解登山裝備知識，認識登山裝備的基本功能、選擇與使用方式，建立符合不同登山環境與行程需求的裝備觀念。</p>
          
          <h2>本章核心</h2>
          <p>安全來自一套「能被理解的系統。」在山上，裝備需要同時回應環境、行程與人的狀態。選擇前理解功能，使用時理解限制，才不會讓一件看似齊全的裝備成為錯誤判斷的遮蔽。</p>
          <h3>01｜環境</h3>
          <p>風、雨、低溫、地面與海拔，決定裝備需要承受什麼。</p>
          <h3>02｜使用者</h3>
          <p>經驗、體質、熟練度與隊伍分工，決定能否把工具用對。</p>
          <h3>03｜備援</h3>
          <p>關鍵功能不能只依賴一種物品、一顆電池或一個人。</p>

          <h2>三層穿衣系統</h2>
          <p>讓身體在變化裡，保有調節空間。當行進、休息、風勢與雨勢快速交替，衣著應是一個可隨時開關與調整的系統。先處理濕氣，再保留熱量，最後才是阻擋風雨。</p>
          <p>三層：01 基層（帶離濕氣）、02 中層（保留熱量）、03 外層（擋風雨）。核心標語：用「調節」取代「硬撐」保暖。</p>

          <h2>背包重量配置</h2>
          <p>重的靠背，常用的靠上，每一件都要能被找到。背包系統的目標不是把物品藏進去，而是讓重心穩定、快取物清楚、乾濕分離，並在行進與休息之間降低不必要的拆包次數。</p>
          <p>重：貼近背部中心。快：留在上層與側袋。乾：獨立防水收納。</p>
          <p>01 頂袋（雨具、手套、頭燈，高頻快取）、02 上層（保暖衣、行動糧，停留前可拿）、03 核心（水、食物、爐具，重物貼背）、04 底層（睡袋、備品，輕而蓬鬆）。</p>

          <h2>六個系統，一個共同的安全判斷</h2>
          <p>分類不是為了記住更多名詞，而是讓你看見哪一項功能缺少、哪一項備援不存在，以及哪些裝備必須一起被檢查。環境 × 路線 ↓ 裝備判斷 ↓ 使用者 × 備援。</p>

          <h2>裝備分類資料庫</h2>
          <p>不是推薦清單，是功能判讀資料庫。沒有品牌比較，只有可用於自己的判斷問題。</p>
          <h3>衣著系統</h3>
          <p>讓身體的熱與濕氣被正確管理。包含排汗基層、保暖中層、防風防水外層。</p>
          <h3>背包系統</h3>
          <p>讓重量貼近身體，而不是拖累身體。包含主背包與背負系統、防水收納系統、快取與外掛管理。</p>
          <h3>露營系統</h3>
          <p>在停留時建立可恢復體溫的空間。包含帳篷或遮蔽系統、睡袋、睡墊。</p>
          <h3>炊事系統</h3>
          <p>把熱量與燃料維持在可控狀態。包含爐具、燃料管理、鍋具與食物收納。</p>
          <h3>導航系統</h3>
          <p>把位置、路線與備援資訊分開管理。包含紙本地圖與指北針、GPS 與離線航跡、頭燈與照明備援。</p>
          <h3>安全系統</h3>
          <p>保留能延緩風險、呼叫支援的餘裕。包含急救與個人藥品、通訊與求援工具、修補與備用零件。</p>

          <h2>十個教學單元</h2>
          <p>01 登山裝備的基本觀念、02 登山裝備分類、03 三層穿衣系統、04 防水裝備與雨天管理、05 背包系統、06 睡眠與露營系統、07 炊事與燃料管理、08 電子設備與電力管理、09 特殊路線裝備、10 裝備檢查與失效管理。</p>

          <h2>裝備失效風險</h2>
          <p>失效管理，從出發前開始。01 情境判讀 → 02 功能確認 → 03 出發前檢查 → 04 現場調節 → 05 保留備援。先停止依賴失效裝備，再切換備援與撤退判斷。</p>

          <h2>出發前裝備 CHECKLIST</h2>
          <p>出發前 10 分鐘，替風險留下一個可被發現的空位。15項行前系統檢查項目。</p>
